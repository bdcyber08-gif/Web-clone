<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BD DARKNETX99 | Professional Web Cloner</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;800&family=Orbitron:wght@500;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --accent: #00ffcc;
            --accent-2: #bc00ff;
            --bg: #020617;
            --glass: rgba(15, 23, 42, 0.8);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: #fff; overflow-x: hidden; min-height: 100vh; }
        
        /* কালারফুল ব্যাকগ্রাউন্ড এনিমেশন */
        .bg-animate { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(45deg, #000428, #004e92, #000000); background-size: 400% 400%; animation: gradientBG 15s ease infinite; z-index: -2; }
        @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        .container { padding: 40px 20px; }

        .main-card { width: 100%; max-width: 800px; background: var(--glass); padding: 2px; border-radius: 30px; position: relative; overflow: hidden; margin: 0 auto 40px; box-shadow: 0 0 50px rgba(0, 255, 204, 0.15); border: 1px solid rgba(0, 255, 204, 0.2); }
        .card-inner { background: #0f172a; border-radius: 28px; padding: 40px 25px; position: relative; z-index: 1; }

        .input-wrapper { background: rgba(0,0,0,0.5); border: 2px solid var(--accent); border-radius: 20px; display: flex; padding: 8px; flex-wrap: wrap; gap: 10px; box-shadow: inset 0 0 15px rgba(0, 255, 204, 0.2); }
        input { flex: 1; min-width: 200px; background: transparent; border: none; color: #fff; padding: 15px; outline: none; font-size: 1.1rem; }
        
        .btn-extract { background: linear-gradient(90deg, var(--accent), var(--accent-2)); color: #000 !important; border: none; padding: 15px 35px; border-radius: 15px; font-weight: 900; cursor: pointer; text-transform: uppercase; font-family: 'Orbitron'; letter-spacing: 1px; transition: 0.4s; }
        .btn-extract:hover { transform: scale(1.05); box-shadow: 0 0 25px var(--accent); }

        /* রিং এবং লোগো সেকশন */
        .profile-section { text-align: center; margin-top: 50px; }
        .ring-container { width: 160px; height: 160px; margin: 0 auto 20px; position: relative; display: flex; align-items: center; justify-content: center; }
        .ring-animate { position: absolute; width: 100%; height: 100%; border-radius: 50%; border: 4px solid transparent; border-top-color: var(--accent); border-bottom-color: var(--accent-2); animation: rotateRing 3s linear infinite; }
        .inner-logo { width: 130px; height: 130px; border-radius: 50%; object-fit: contain; background: #000; padding: 5px; z-index: 2; border: 2px solid rgba(255,255,255,0.1); }

        .dev-name { font-family: 'Orbitron', sans-serif; font-size: 2rem; font-weight: 900; background: linear-gradient(to right, #fff, var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-shadow: 0 0 15px rgba(0,255,204,0.3); }
        .dev-title { color: var(--accent-2); font-weight: 800; font-size: 0.8rem; letter-spacing: 3px; text-transform: uppercase; margin-top: 5px; }

        .btn-group { display: flex; justify-content: center; gap: 15px; margin-top: 30px; }
        .social-btn { padding: 12px 30px; border-radius: 50px; text-decoration: none; font-weight: 800; font-size: 0.9rem; transition: 0.3s; border: 2px solid; }
        .btn-contact { background: var(--accent); color: #000 !important; border-color: var(--accent); }
        .btn-channel { color: #fff !important; border-color: var(--accent-2); background: rgba(188, 0, 255, 0.1); }
        
        #loader { display: none; margin-top: 20px; }
        .spinner { width: 45px; height: 45px; border: 5px solid var(--accent); border-top-color: transparent; border-radius: 50%; animation: rotateRing 1s linear infinite; display: inline-block; }
        pre { background: #011627; padding: 25px; border-radius: 20px; color: var(--accent); border: 1px solid rgba(0,255,204,0.2); max-height: 500px; overflow: auto; text-align: left; margin-top: 25px; white-space: pre-wrap; font-family: 'Consolas', monospace; }

        @keyframes rotateRing { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="bg-animate"></div>

<div class="container">
    <div class="main-card">
        <div class="card-inner">
            <div class="input-wrapper">
                <input type="url" id="targetUrl" placeholder="Enter target website link..." required>
                <button onclick="fetchSource()" class="btn-extract">Extract <i class="fas fa-bolt"></i></button>
            </div>
            
            <div id="loader">
                <div class="spinner"></div>
                <p style="color:var(--accent); margin-top:10px; font-weight: bold;">CLONING DATA...</p>
            </div>

            <div id="result-area" style="display:none;">
                <button class="btn-extract" style="margin: 20px 0 10px; font-size: 0.8rem; padding: 10px 20px;" onclick="copyCode()">Copy Code</button>
                <pre id="output"></pre>
            </div>
        </div>
    </div>

    <div class="profile-section">
        <div class="ring-container">
            <div class="ring-animate"></div>
            <img src="https://i.ibb.co/Vp8L38Xm/12450.png" alt="Logo" class="inner-logo">
        </div>
        <h2 class="dev-name">ASIF BOSS</h2>
        <p class="dev-title">OWNER OF BD DARKNETX99</p>

        <div class="btn-group">
            <a href="https://t.me/banglaadmin01" target="_blank" class="social-btn btn-contact">Contact Me</a>
            <a href="https://t.me/new_bangla_mod" target="_blank" class="social-btn btn-channel">Join Channel</a>
        </div>
    </div>
</div>

<footer style="text-align: center; padding: 50px; color: var(--accent); font-family: 'Orbitron'; font-size: 0.7rem; letter-spacing: 2px;">
    DESIGNED BY BD DARKNETX99 © 2026
</footer>

<script>
    async function fetchSource() {
        const urlInput = document.getElementById('targetUrl').value;
        if (!urlInput) { alert('URL দিন!'); return; }
        
        document.getElementById('loader').style.display = 'block';
        document.getElementById('result-area').style.display = 'none';

        try {
            const response = await fetch('/api', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: 'ajax_url=' + encodeURIComponent(urlInput)
            });
            const data = await response.text();
            document.getElementById('output').innerText = data;
            document.getElementById('loader').style.display = 'none';
            document.getElementById('result-area').style.display = 'block';
        } catch (e) {
            alert('Error!');
            document.getElementById('loader').style.display = 'none';
        }
    }

    function copyCode() {
        const text = document.getElementById('output').innerText;
        navigator.clipboard.writeText(text);
        alert('Code Copied!');
    }
</script>
</body>
</html>
